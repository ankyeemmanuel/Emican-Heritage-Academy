<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emican Heritage Academy</title>
    <style>
        :root {
            --navy-deep: #0D2040;
            --navy-light: #1E3A8A;
            --gold-crest: #C59B27;
            --sky-blue: #7DD3FC;
            --bg-light: #F8FAFC;
            --text-dark: #1E293B;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
        }

        header {
            background: linear-gradient(135deg, var(--navy-deep), var(--navy-light));
            color: var(--white);
            padding: 1.5rem 2rem;
            border-bottom: 5px solid var(--gold-crest);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo-placeholder {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--white);
            border: 3px solid var(--gold-crest);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--navy-deep);
            overflow: hidden;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .school-titles h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--white);
            text-transform: uppercase;
        }

        .school-titles p {
            color: var(--gold-crest);
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 0.95rem;
        }

        nav {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        nav button {
            background-color: transparent;
            border: 1px solid var(--gold-crest);
            color: var(--white);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        nav button:hover, nav button.active {
            background-color: var(--gold-crest);
            color: var(--navy-deep);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
            border-top: 4px solid var(--navy-deep);
        }

        .card h2 {
            color: var(--navy-deep);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--sky-blue);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 600;
            color: var(--navy-deep);
        }
